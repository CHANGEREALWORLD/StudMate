<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Page</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body, html { height: 100%; }
    body {
      background: url("home(imp).jpg") no-repeat center center/cover;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      /* box-shadow: 0 8px 32px rgba(5, 18, 209, 0.537); */
       box-shadow: 0 10px 32px rgba(55,225,196,0.37);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      width: 380px;
      color: white;
      animation: fadeIn 1s ease-in-out;
    }
    h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { font-size: 14px; margin-bottom: 5px; display: block; }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .form-group input::placeholder { color: rgba(255, 255, 255, 0.6); }
    .toggle-password {
      position: absolute;
      top: 35px;
      right: 10px;
      cursor: pointer;
      color: #ccc;
    }
    .checkbox { display: flex; align-items: center; font-size: 13px; margin-bottom: 15px; }
    .checkbox input { margin-right: 10px; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #048aaf;
      /* background-color: red; */
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    /* .btn:hover { background: #92fe9d; } */
    .btn:hover{
      /* background: red; */
    background: crimson;}


    .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .login-link a { 
      color: #00c9ff;
       text-decoration: none; }
       .login-link a:hover{
        /* color: red;
         */
         color:crimson;
       }
    input[type="file"] { color: white; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 400px) { .container { width: 90%; } }
  </style>
</head>
<body>

  <div class="container" data-aos="fade-up">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="form-group" data-aos="fade-right">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required />
      </div>
      <div class="form-group" data-aos="fade-left">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>
      <div class="form-group" data-aos="fade-right">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
        <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
      </div>
      <div class="form-group" data-aos="fade-left">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
        <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
      </div>
      <!-- <div class="form-group" data-aos="fade-right">
        <label for="profilePic">Profile Picture (optional)</label>
        <input type="file" id="profilePic" accept="image/*" onchange="previewImage(event)">
        <div id="previewContainer" style="margin-top: 10px; text-align: center;">
          <img id="previewImage" src="" alt="Preview" style="max-width: 100px; max-height: 100px; border-radius: 50%; display: none; border: 2px solid #00c9ff;" />
        </div>
      </div> -->
      <div class="checkbox" data-aos="fade-left">
        <input type="checkbox" id="terms" required />
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>
      <button class="btn" type="submit" data-aos="zoom-in">Register</button>
      <div id="registerMessage" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
      <!-- <div class="login-link" data-aos="fade-up"> -->
        <div class="login-link">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </form>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script type="module">
    AOS.init();

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
    function previewImage(event) {
      const preview = document.getElementById('previewImage');
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        preview.src = '';
        preview.style.display = 'none';
      }
    }

    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDt68xNiWU25HsWC2rsJfn0YlmCTd9Asbs",
      authDomain: "studmate-e1527.firebaseapp.com",
      projectId: "studmate-e1527",
      storageBucket: "studmate-e1527.appspot.com", // FIXED
      messagingSenderId: "156725135850",
      appId: "1:156725135850:web:998c70a754ec3bbdb14a93"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showMessage(message, color = "red") {
      const msgDiv = document.getElementById("registerMessage");
      msgDiv.style.color = color;
      msgDiv.innerText = message;
      setTimeout(() => { msgDiv.innerText = ""; }, 5000);
    }

    // Handle Registration
    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (!fullName || !email || !password || !confirmPassword) {
        showMessage("Please fill in all fields");
        return;
      }
      if (password !== confirmPassword) {
        showMessage("Passwords do not match");
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then(async (userCredential) => {
          const user = userCredential.user;
          await updateProfile(user, { displayName: fullName });

          localStorage.setItem("loggedInUserId", user.uid);
          showMessage("Registration successful! Redirecting...", "green");

          setTimeout(() => { window.location.href = "login.html"; }, 1200);
        })
        .catch((error) => {
          if (error.code === "auth/email-already-in-use") {
            showMessage("Email is already registered");
          } else if (error.code === "auth/weak-password") {
            showMessage("Password should be at least 6 characters");
          } else if (error.code === "auth/invalid-email") {
            showMessage("Invalid email format");
          } else {
            showMessage("Registration failed. Try again.");
          }
        });
    });
  </script>
</body>
</html>
