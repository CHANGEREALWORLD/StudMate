<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📌 Pinned Tasks – StudMate</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>

  <style>
    :root {
      --green: #22c55e;
      --danger: #ef4444;
      --text: #f1f5f9;
      --yellow: #facc15;
      --red: #ef4444;
    }
    body {
      background: url("home(imp).jpg") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: var(--text);
      backdrop-filter: blur(6px);
    }
    .container { max-width: 750px; margin: 40px auto;
       /* background: rgba(255,255,255,0.1); */
       background-color: rgba(0, 0, 0, 0.545);
      border-radius: 20px; padding: 25px 30px; 
      /* box-shadow: rgba(0, 234, 255, 0.71); */
      box-shadow: 0 10px 32px rgba(56, 246, 214, 0.468);

      /* box-shadow: 0 8px 25px rgba(0,0,0,0.25);  */
      backdrop-filter: blur(12px); }
    h1 { text-align: center;
       margin-bottom: 20px; 
       font-size: 2rem; }
    .task-input { display: flex; 
      flex-wrap: wrap;
       gap: 10px; 
       margin-bottom: 15px;
       }
    .task-input input, .task-input select { flex: 1; padding: 10px; border-radius: 10px; border: none; outline: none;
       background: rgba(255,255,255,0.05); 
       color: var(--text);
       }
       #priority{
        background-color: rgba(0, 0, 0, 0.636);
       }
    .btn { padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; color: #fff; transition: all 0.25s ease;}
    .add-btn { background: var(--green); } .clear-btn { 
       background: var(--danger); 
    }
    .filter-bar { margin: 10px 0 20px; display: flex; gap: 10px; }
    .filter-bar input, .filter-bar select { padding: 8px; border-radius: 8px; border: none; 
      /* background: rgba(255,255,255,0.05); */
      background-color: black;
       color: var(--text); flex: 1;}
    ul { list-style: none; padding: 0; margin: 0; }
    li { background-color: black;
      /* background: rgba(255, 255, 255, 0);  */
       margin: 10px 0; padding: 12px 16px; border-radius: 12px;
         display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s ease; }
    li:hover { transform: scale(1.02); }
    li.completed span { text-decoration: line-through; opacity: 0.6; }
    .badge { padding: 3px 8px; border-radius: 8px; font-size: 12px; margin-left: 8px; font-weight: bold; }
    .low { background: var(--green); } .medium { background: var(--yellow); 
      color: black; } .high { background: var(--red); }
    .actions button { margin-left: 6px; padding: 6px 10px; border: none; border-radius: 8px; cursor: pointer; color: #fff;}
    .pin { background: var(--green); } .delete { background: var(--danger); } .done { background: var(--yellow); 
      
       color: black; 
     }
    .progress-container { margin-top: 20px; 
      /* background: rgba(255,255,255,0.05);  */
      border-radius: 12px; overflow: hidden; }
    .progress-bar { height: 18px; background: var(--green); width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="container" data-aos="zoom-in">
    <h1>📌 Pinned Tasks</h1>

    <!-- Input -->
    <div class="task-input">
      <input type="text" id="taskInput" placeholder="Enter task...">
      <input type="date" id="dueDate">
      <select id="priority">
        <option value="low">🟢 Low</option>
        <option value="medium">🟡 Medium</option>
        <option value="high">🔴 High</option>
      </select>
      <button class="btn add-btn" onclick="addTask()">Add</button>
    </div>

    <!-- Search & Filter -->
    <div class="filter-bar">
      <input type="text" id="search" placeholder="Search tasks..." onkeyup="renderTasks()">
      <select id="filter" onchange="renderTasks()">
        <option value="all">All</option>
        <option value="pinned">Pinned</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
      </select>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>

    <!-- Progress -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Clear Button -->
    <div style="text-align:center; margin-top:20px;">
      <button class="btn clear-btn" onclick="clearTasks()">Clear All</button>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt68xNiWU25HsWC2rsJfn0YlmCTd9Asbs",
      authDomain: "studmate-e1527.firebaseapp.com",
      projectId: "studmate-e1527",
      storageBucket: "studmate-e1527.appspot.com",
      messagingSenderId: "156725135850",
      appId: "1:156725135850:web:998c70a754ec3bbdb14a93"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let tasksRef = null;
    let tasks = []; // local cache

    // Add task
    async function addTask() {
      const text = document.getElementById("taskInput").value.trim();
      const due = document.getElementById("dueDate").value;
      const priority = document.getElementById("priority").value;
      if (!text) return;
      await addDoc(tasksRef, { text, due, priority, pinned: false, completed: false });
      document.getElementById("taskInput").value = "";
    }

    // Toggle complete
    async function toggleComplete(id, current) {
      await updateDoc(doc(tasksRef, id), { completed: !current });
    }

    // Toggle pin
    async function pinTask(id, current) {
      await updateDoc(doc(tasksRef, id), { pinned: !current });
    }

    // Delete task
    async function deleteTask(id) {
      await deleteDoc(doc(tasksRef, id));
    }

    // Clear all
    async function clearTasks() {
      if (confirm("Clear all tasks?")) {
        const snap = await getDocs(tasksRef);
        snap.forEach(d => deleteDoc(d.ref));
      }
    }

    // Render
    function renderTasks() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      const search = document.getElementById("search").value.toLowerCase();
      const filter = document.getElementById("filter").value;

      let filtered = tasks.filter(t => t.text.toLowerCase().includes(search));
      if (filter === "pinned") filtered = filtered.filter(t => t.pinned);
      if (filter === "completed") filtered = filtered.filter(t => t.completed);
      if (filter === "pending") filtered = filtered.filter(t => !t.completed);

      filtered.sort((a,b)=> (b.pinned - a.pinned));

      filtered.forEach(task => {
        const li = document.createElement("li");
        li.className = task.completed ? "completed" : "";

        let dueText = "";
        if (task.due) {
          const days = Math.ceil((new Date(task.due) - new Date())/(1000*60*60*24));
          dueText = days >= 0 ? ` ⏳ ${days}d left` : ` ⌛ Overdue`;
        }

        li.innerHTML = `
          <span>${task.text} <span class="badge ${task.priority}">${task.priority}</span> ${dueText}</span>
          <div class="actions">
            <button class="done" onclick="toggleComplete('${task.id}', ${task.completed})">${task.completed ? "Undo" : "✔"}</button>
            <button class="pin" onclick="pinTask('${task.id}', ${task.pinned})">${task.pinned ? "Unpin" : "📌"}</button>
            <button class="delete" onclick="deleteTask('${task.id}')">❌</button>
          </div>`;
        list.appendChild(li);
      });

      // update progress
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      document.getElementById("progressBar").style.width = (total? (done/total)*100:0) + "%";
    }

    // Auth & Realtime listener
    onAuthStateChanged(auth, user => {
      if (user) {
        tasksRef = collection(db, "profiles", user.uid, "PinnedTasks");
        onSnapshot(tasksRef, snap => {
          tasks = snap.docs.map(d => ({id: d.id, ...d.data()}));
          renderTasks();
        });
      } else {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider);
      }
    });

    // Expose
    window.addTask = addTask;
    window.toggleComplete = toggleComplete;
    window.pinTask = pinTask;
    window.deleteTask = deleteTask;
    window.clearTasks = clearTasks;
    window.renderTasks = renderTasks;
  </script>
</body>
</html>
