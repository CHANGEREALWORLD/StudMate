<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📅 Daily Planner - StudMate</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: url("home(imp).jpg") no-repeat center center fixed;
      background-size: cover;
    }

    body::before {
      content: ' ';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    h2 {
      text-align: center;
      color: #ffffff;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .planner-container {
      max-width: 650px;
      margin: 60px auto;
      padding: 40px;
      border-radius: 17px;
      box-shadow: 0 10px 32px rgba(55, 225, 196, 0.37);
      backdrop-filter: blur(10px);
      color: white;
      position: relative;
      z-index: 1;
      width: 380px;
    }

    input,
    button {
      font-size: 16px;
      padding: 10px;
      margin: 8px 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    input[type="text"] {
      width: 45%;
    }

    input[type="date"] {
      width: 30%;
    }

    button {
      background-color: white;
      color: black;
      border: 2px solid black;
      cursor: pointer;
    }

    button:hover {
      background-color: red;
      color: white;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      background-color: black;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-buttons button {
      margin-left: 6px;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .done {
      text-decoration: line-through;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="planner-container">
    <h2>📅 Daily Planner</h2>
    <input type="text" id="TaskInput" placeholder="Enter Task Name" />
    <input type="date" id="TaskDate" />
    <button onclick="addTask()">Add Task</button>
    <ul id="TaskList"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, where, updateDoc, deleteDoc, doc 
    } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    // 🔹 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDt68xNiWU25HsWC2rsJfn0YlmCTd9Asbs",
      authDomain: "studmate-e1527.firebaseapp.com",
      projectId: "studmate-e1527",
      storageBucket: "studmate-e1527.appspot.com",
      messagingSenderId: "156725135850",
      appId: "1:156725135850:web:998c70a754ec3bbdb14a93"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const taskInput = document.getElementById("TaskInput");
    const taskDate = document.getElementById("TaskDate");
    const taskList = document.getElementById("TaskList");

    let currentUser = null;

    // ✅ Auth check
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadTasks();
      } else {
        alert("⚠️ Please login first.");
        window.location.href = "login.html";
      }
    });

    // ✅ Add Task
    window.addTask = async function() {
      if (!currentUser) return;

      const taskText = taskInput.value.trim();
      const dueDate = taskDate.value;

      if (taskText === "" || dueDate === "") {
        alert("Please enter both task and date.");
        return;
      }

      await addDoc(collection(db, "profiles", currentUser.uid, "Daily"), {
        task: taskText,
        date: dueDate,
        done: false,
        createdAt: new Date()
      });

      taskInput.value = "";
      taskDate.value = "";
    };

    // ✅ Load Tasks in realtime
    function loadTasks() {
      const q = query(collection(db, "profiles", currentUser.uid, "Daily"));
      onSnapshot(q, (snapshot) => {
        taskList.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const task = docSnap.data();
          const li = document.createElement("li");

          const taskContent = document.createElement("span");
          taskContent.textContent = `${task.task} (📅 ${task.date})`;
          if (task.done) taskContent.classList.add("done");

          const buttonGroup = document.createElement("span");
          buttonGroup.className = "task-buttons";

          const doneBtn = document.createElement("button");
          doneBtn.textContent = "✓ Done";
          doneBtn.onclick = async () => {
            await updateDoc(doc(db, "profiles", currentUser.uid, "Daily", docSnap.id), {
              done: !task.done
            });
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "🗑 Delete";
          deleteBtn.onclick = async () => {
            await deleteDoc(doc(db, "profiles", currentUser.uid, "Daily", docSnap.id));
          };

          buttonGroup.appendChild(doneBtn);
          buttonGroup.appendChild(deleteBtn);

          li.appendChild(taskContent);
          li.appendChild(buttonGroup);
          taskList.appendChild(li);
        });
      });
    }
  </script>
</body>
</html>
