<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body, html { height: 100%; }
    body {
      background: url("home(imp).jpg") no-repeat center center/cover;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      /* box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37); */
      /* box-shadow: 0 8px 32px rgba(5, 18, 209, 0.537); */
       box-shadow: 0 10px 32px rgba(56, 246, 214, 0.468);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      width: 380px;
      color: white;
      animation: fadeIn 1s ease-in-out;
    }
    h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { font-size: 14px; margin-bottom: 5px; display: block; }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .form-group input::placeholder { color: rgba(255, 255, 255, 0.6); }
    .toggle-password {
      position: absolute;
      top: 35px;
      right: 10px;
      cursor: pointer;
      color: #ccc;
    }
    .btn {
      width: 100%;
      padding: 12px;
      /* background: #00c9ff; */
      /* background:rgb(0, 153, 255); */
       background: #048aaf;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
       /* background: red; */
       /* background: #92fe9d;  */
       background-color: crimson;
      } 
    .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .login-link a { color: #00c9ff; text-decoration: none; }
    .login-link a:hover{
      /* background-color: crimson; */
      color:crimson;

    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 400px) { .container { width: 90%; } }
  </style>
</head>
<body>

  <div class="container" data-aos="fade-up">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group" data-aos="fade-right">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>
      <div class="form-group" data-aos="fade-left">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
        <span class="toggle-password" onclick="togglePassword('password')">👁️</span> 
      </div>
      <button class="btn" type="submit" data-aos="zoom-in">Login</button>
  
      <div id="loginMessage" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
      <div class="login-link" data-aos="fade-up">
         <a href="forgot.html">Forgot Password?</a><br>

        Don't have an account? <a href="register.html">Register</a>
      </div>
    </form>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script type="module">
    AOS.init();

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDt68xNiWU25HsWC2rsJfn0YlmCTd9Asbs",
      authDomain: "studmate-e1527.firebaseapp.com",
      projectId: "studmate-e1527",
      storageBucket: "studmate-e1527.appspot.com",
      messagingSenderId: "156725135850",
      appId: "1:156725135850:web:998c70a754ec3bbdb14a93"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showMessage(message, color = "red") {
      const msgDiv = document.getElementById("loginMessage");
      msgDiv.style.color = color;
      msgDiv.innerText = message;
      setTimeout(() => { msgDiv.innerText = ""; }, 5000);
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        showMessage("Please fill in all fields");
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          localStorage.setItem("loggedInUserId", user.uid);
          showMessage("Login successful! Redirecting...", "green");

          setTimeout(() => { window.location.href = "profile.html"; }, 1200);
        })
        .catch((error) => {
          if (error.code === "auth/user-not-found") {
            showMessage("No account found with this email");
          } else if (error.code === "auth/wrong-password") {
            showMessage("Incorrect password");
          } else if (error.code === "auth/invalid-email") {
            showMessage("Invalid email format");
          } else {
            showMessage("Login failed. Try again.");
          }
        });
    });
  </script>
</body>
</html>
