<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body, html { height: 100%; }
    body {
      background: url("home(imp).jpg") no-repeat center center/cover;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      /* box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37); */
      box-shadow: 0 8px 32px rgba(5, 18, 209, 0.537);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      width: 380px;
      color: white;
      animation: fadeIn 1s ease-in-out;
    }
    h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { font-size: 14px; margin-bottom: 5px; display: block; }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .form-group input::placeholder { color: rgba(255, 255, 255, 0.6); }
    .btn {
      width: 100%;
      padding: 12px;
      background: #00c9ff;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover { background-color: red; 
      /* background: #92fe9d;  */
      } 
    .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
    .login-link a { color: #00c9ff; text-decoration: none; }
    .login-link a:hover{color: red;}
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 400px) { .container { width: 90%; } }
  </style>
</head>
<body>

  <div class="container" data-aos="fade-up">
    <h2>Forgot Password</h2>
    <form id="forgotForm">
      <div class="form-group" data-aos="fade-right">
        <label for="email">Enter your email</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>
      <button class="btn" type="submit" data-aos="zoom-in">Send Reset Link</button>
      <div id="message" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
      <div class="login-link" data-aos="fade-up">
        <a href="login.html">Back to Login</a>
      </div>
    </form>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script type="module">
    AOS.init();

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDt68xNiWU25HsWC2rsJfn0YlmCTd9Asbs",
      authDomain: "studmate-e1527.firebaseapp.com",
      projectId: "studmate-e1527",
      storageBucket: "studmate-e1527.appspot.com",
      messagingSenderId: "156725135850",
      appId: "1:156725135850:web:998c70a754ec3bbdb14a93"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showMessage(message, color = "red") {
      const msgDiv = document.getElementById("message");
      msgDiv.style.color = color;
      msgDiv.innerText = message;
      setTimeout(() => { msgDiv.innerText = ""; }, 5000);
    }

    document.getElementById("forgotForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Please enter your email");
        return;
      }

      sendPasswordResetEmail(auth, email)
        .then(() => {
          showMessage("Reset link sent! Check your email.", "green");
        })
        .catch((error) => {
          if (error.code === "auth/user-not-found") {
            showMessage("No account found with this email");
          } else if (error.code === "auth/invalid-email") {
            showMessage("Invalid email format");
          } else {
            showMessage("Failed to send reset link. Try again.");
          }
        });
    });
  </script>
</body>
</html>
