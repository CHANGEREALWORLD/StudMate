     <section class="hero" data-aos="fade-up" data-aos-delay="500">
        <div class="hero-text">
            <h1>Organize Your Academic Life</h1>
            <p>StudMate helps you manage your goals, plan your study hours, track SGPA,<br>and prepare for a successful career — all in one place.</p>

     <script type="module" src="firebase-config.js"></script>

     
     <script>
        AOS.init();

        const app=document.getElementById('welcome-text');
        const typewriter=new Typewriter(app,{
            loop:true,
            delay:70,

        });
        typewriter
        .typeString('Welcome to StudMate!')
        .pauseFor(1500)
        .deleteAll()
        .typeString('Plan Better.Study Smarter.')
        .pauseFor(1500)
        .deleteAll()
        .typeString('Your acadmic journey start here 🚀')
        .pauseFor(2000)
        .start();
     </script>
